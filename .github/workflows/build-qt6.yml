name: Build Tiddler Qt6 click

on:
  push:
    branches: [master]
    paths-ignore:
      - 'angelfish-src/angelfish-23.08.5/**'
      - '.github/workflows/build.yml'
      - 'AGENTS.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Add UBports 24.04-2.x repo (Qt6 stack)
        run: |
          curl -fsSL http://repo.ubports.com/pubkey.gpg | sudo gpg --dearmor -o /usr/share/keyrings/ubports.gpg
          sudo chmod 644 /usr/share/keyrings/ubports.gpg
          echo "deb [signed-by=/usr/share/keyrings/ubports.gpg] http://repo.ubports.com/ 24.04-2.x main" | sudo tee /etc/apt/sources.list.d/ubports.list
          printf 'Package: *\nPin: origin "repo.ubports.com"\nPin-Priority: 1500\n' | sudo tee /etc/apt/preferences.d/ubports.pref
          sudo apt-get update

      - name: Install Qt6 dev stack (base 6.10.2 + webengine 6.11.2)
        run: |
          sudo apt-get install -y --allow-downgrades --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-base-private-dev qt6-base-dev-tools \
            qt6-declarative-dev qt6-declarative-private-dev qt6-declarative-dev-tools \
            qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools \
            qt6-svg-dev qt6-shadertools-dev \
            qt6-wayland-dev qt6-wayland-private-dev qt6-wayland \
            qt6-5compat-dev qt6-webchannel-dev qt6-positioning-dev \
            'qt6-webengine-dev=6.11.2*' 'qt6-webengine-dev-tools=6.11.2*' \
            'libqt6webenginecore6=6.11.2*' 'libqt6webenginequick6=6.11.2*' \
            'libqt6webenginewidgets6=6.11.2*' 'qml6-module-qtwebengine=6.11.2*' \
            'qml6-module-qtwebengine-controlsdelegates=6.11.2*' \
            'libqt6webengine6-data=6.11.2*' \
            libqt6webenginecore6-bin libqt6sql6-sqlite \
            qtubuntu-qt6 maliit-inputcontext-qt6 \
            libktactilefeedback1 qml6-module-ktactilefeedback \
            qml6-module-qt5compat-graphicaleffects \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates qml6-module-qt-labs-settings \
            qml6-module-qtcore qml6-module-qtqml-workerscript \
            gettext libwayland-dev wayland-protocols libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-util-dev libxcb-keysyms1-dev libxcb-res0-dev libxcb-icccm4-dev \
            libxcb-ewmh-dev libxcb-image0-dev libxcb-render-util0-dev libxcb-xkb-dev \
            libxcb-cursor-dev libxcb-randr0-dev libxcb-xfixes0-dev libxcb-shape0-dev \
            libxcb-sync-dev libxcb-xinerama0-dev libxcb-xtest0-dev libxcb-record0-dev \
            libxcb-screensaver0-dev libxcb-present-dev libxcb-dri3-dev libxcb-composite0-dev \
            libxcb-damage0-dev libxcb-render0-dev libxcb-shm0-dev libxcb-glx0-dev \
            libxcb-xinput-dev libxcb-xv0-dev libxcb-dri2-0-dev libxfixes-dev libxrender-dev libxext-dev

      - name: Fetch KF6 sources
        run: ./fetch-kf6.sh

      - name: Build KF6 stack
        run: |
          mkdir -p kf6-out
          SRC="$PWD/kf6-src" OUT="$PWD/kf6-out" bash kf6-src/build-kf6.sh

      - name: Build angelfish (Qt6)
        run: |
          cd angelfish-src/angelfish-v26.08.3
          cmake -B build-qt6 -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/kf6-out" \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/stage"
          cmake --build build-qt6 -j$(nproc)

      - name: Assemble click dir
        run: |
          sudo apt-get install -y --no-install-recommends breeze-icon-theme || true
          KF6_PREFIX="$GITHUB_WORKSPACE/kf6-out" \
          ANGELFISH_BIN="$GITHUB_WORKSPACE/angelfish-src/angelfish-v26.08.3/build-qt6/bin/angelfish" \
          bash scripts/assemble-click-qt6.sh

      - name: Package click
        run: |
          sudo apt-get install -y click 2>/dev/null || true
          if command -v click >/dev/null; then
            click build click-qt6
          else
            tar -czf tiddler-qt6-click-dir.tar.gz -C click-qt6 .
            echo "click tool unavailable; packaged staging dir as tarball instead"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tiddler-qt6-click
          path: |
            *.click
            tiddler-qt6-click-dir.tar.gz
          if-no-files-found: warn
